[project]
name = "stockdb-ai"
version = "0.3.1"
description = "free-stockdb 本地量化数据引擎的 Docker 部署 + webui 运维控制台"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
]

[project.scripts]
webui = "webui.app:main"

[tool.uv]
# 统一 Python 版本（本机开发/容器一致）；free-threaded 待上游 pybao abi3t 修复后评估
package = false

[tool.uv.sources]
# 无第三方依赖；pybao 写库通过 PYTHONPATH 注入（见 docker/Dockerfile 的 ENV PYTHONPATH）

[project.optional-dependencies]
# jsonschema：仅契约测试（interfaces/mcp/test_market_v3.py 与 contract/
# validate_contract.py）需要；运行时零依赖不变（market_v3 纯标准库）。
dev = [
    "jsonschema>=4.18",
]
